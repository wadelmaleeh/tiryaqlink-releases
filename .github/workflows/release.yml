name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1). A matching v<version> tag must exist.'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts
        id: artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ls -la ./dist
          if [ ! -f "./dist/TiryaQLink-Setup-${VERSION}.exe" ]; then
            echo "ERROR: Windows installer not found at ./dist/TiryaQLink-Setup-${VERSION}.exe"
            exit 1
          fi
          echo "Windows installer found: ./dist/TiryaQLink-Setup-${VERSION}.exe"
          FILES="./dist/TiryaQLink-Setup-${VERSION}.exe"
          if [ -f "./dist/TiryaQLink-${VERSION}.apk" ]; then
            echo "Android APK found: ./dist/TiryaQLink-${VERSION}.apk"
            FILES="${FILES}$'\n'"./dist/TiryaQLink-${VERSION}.apk"
          else
            echo "Android APK not found - only Windows installer included"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TiryaQLink ${{ steps.version.outputs.version }}
          body: |
            ## TiryaQLink ${{ steps.version.outputs.version }}

            ### Windows installer
            - File: `TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe`
            - Permanent URL (app /app/version endpoint): https://github.com/${{ github.repository }}/releases/latest/download/TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe

            ### Android
            Published on Google Play.
          files: ${{ steps.artifacts.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
