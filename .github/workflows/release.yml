name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1). A matching v<version> tag must exist.'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify and attach artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking for artifacts in tagged commit..."
          ls -la

          if [ ! -d "dist" ]; then
            echo "ERROR: dist/ directory not found in tagged commit"
            exit 1
          fi

          if [ ! -f "dist/TiryaQLink-Setup-${VERSION}.exe" ]; then
            echo "ERROR: Windows installer not found at dist/TiryaQLink-Setup-${VERSION}.exe"
            exit 1
          fi

          if [ ! -f "dist/TiryaQLink-${VERSION}.apk" ]; then
            echo "ERROR: Android APK not found at dist/TiryaQLink-${VERSION}.apk"
            exit 1
          fi

          echo "✓ Windows installer found: dist/TiryaQLink-Setup-${VERSION}.exe"
          echo "✓ Android APK found: dist/TiryaQLink-${VERSION}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TiryaQLink ${{ steps.version.outputs.version }}
          body: |
            ## TiryaQLink ${{ steps.version.outputs.version }}

            ### Windows installer
            - File: `TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe`
            - Permanent URL (app /app/version endpoint): https://github.com/${{ github.repository }}/releases/latest/download/TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe"

            ### Android
            Published on Google Play.
          files: |
            dist/TiryaQLink-${{ steps.version.outputs.version }}.apk
            dist/TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
