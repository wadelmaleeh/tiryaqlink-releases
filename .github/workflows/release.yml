name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1). A matching v<version> tag must exist.'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Build Android APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TiryaQLink-${VERSION}.apk"
          echo "APK built successfully"

      - name: Set up Inno Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y innosetup

      - name: Build Windows Installer
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # Compile installer.iss with version placeholder replaced
          sed -e "s/@VERSION@/$VERSION/g" installer.iss > temp_installer.iss
          innosetup temp_installer.iss
          # Move output to expected filename
          if [ -f "Output/TiryaQLink-Setup-${VERSION}.exe" ]; then
            mv "Output/TiryaQLink-Setup-${VERSION}.exe" "dist/TiryaQLink-Setup-${VERSION}.exe"
          elif [ -f "Output/TiryaQLink Setup ${VERSION}.exe" ]; then
            mv "Output/TiryaQLink Setup ${VERSION}.exe" "dist/TiryaQLink-Setup-${VERSION}.exe"
          else
            echo "ERROR: Inno Setup output not found"
            exit 1
          fi
          echo "Windows installer built successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TiryaQLink ${{ steps.version.outputs.version }}
          body: |
            ## TiryaQLink ${{ steps.version.outputs.version }}

            ### Windows installer
            - File: `TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe`
            - Permanent URL (app /app/version endpoint): https://github.com/${{ github.repository }}/releases/latest/download/TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe"

            ### Android
            Published on Google Play.
          files: |
            dist/TiryaQLink-${{ steps.version.outputs.version }}.apk
            dist/TiryaQLink-Setup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
